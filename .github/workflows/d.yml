name: CI

on:
  push:
    branches: [ "v1.x.x" ]
  pull_request:
    branches: [ "v1.x.x" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dlang-community/setup-dlang@v1
    - name: 'Build & Test'
      run: |
        dub build --compiler=$DC
        dub test --compiler=$DC
        
